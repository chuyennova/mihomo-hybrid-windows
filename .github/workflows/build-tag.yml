name: Build exact Mihomo tag — hybrid 4 profiles

on:
  workflow_call:
    inputs:
      upstream_tag:
        required: true
        type: string
      release_revision:
        required: false
        type: string
        default: r1
      publish_release:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Exact stable upstream tag, for example v1.19.30
        required: true
        type: string
      release_revision:
        description: Custom release revision
        required: true
        default: r1
        type: string
      publish_release:
        description: Publish GitHub Release after all checks pass
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: hybrid-build-${{ inputs.upstream_tag }}-${{ inputs.release_revision }}
  cancel-in-progress: false

env:
  BASELINE_TAG: v1.19.29
  PATCH_REVISION: hybrid-4profiles-v6-auto-r2-go126
  UPSTREAM_TAG: ${{ inputs.upstream_tag }}
  RELEASE_REVISION: ${{ inputs.release_revision }}
  GOTOOLCHAIN: local

jobs:
  build:
    name: Patch, test and compile
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      candidate_name: ${{ steps.names.outputs.candidate_name }}
    steps:
      - name: Checkout overlay builder only
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize persistent diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ci-logs/{steps,diagnostics,status}
          : > ci-logs/full-build.log
          {
            echo "upstream_tag=$UPSTREAM_TAG"
            echo "baseline_tag=$BASELINE_TAG"
            echo "patch_revision=$PATCH_REVISION"
            echo "run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a ci-logs/full-build.log
          echo "BUILDER_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "LOG_ROOT=$GITHUB_WORKSPACE/ci-logs" >> "$GITHUB_ENV"

      - name: 01 — Checkout exact upstream tag
        id: clone
        continue-on-error: true
        shell: bash
        run: |
          set +e
          bash scripts/ci_run.sh clone-upstream bash scripts/clone_upstream.sh
          rc=$?
          if [[ -f source/.upstream-commit ]]; then
            echo "UPSTREAM_COMMIT=$(cat source/.upstream-commit)" >> "$GITHUB_ENV"
          fi
          exit "$rc"

      - name: Set up MetaCubeX Go 1.26
        id: setup_go
        if: always()
        continue-on-error: true
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          cache: false

      - name: Verify Go 1.26 and record setup outcome
        if: always()
        shell: bash
        run: |
          set +e
          actual_go="$(go version 2>&1)"
          rc=0
          if [[ "${{ steps.setup_go.outcome }}" != success ]]; then
            rc=1
          elif [[ "$actual_go" != *"go1.26"* ]]; then
            rc=1
          fi
          echo "$rc" > ci-logs/status/setup-go.exit
          {
            echo "setup_go_outcome=${{ steps.setup_go.outcome }}"
            echo "expected_go=go1.26"
            echo "actual_go=$actual_go"
          } | tee -a ci-logs/full-build.log ci-logs/diagnostics/setup-go.txt

      - name: 02 — Record Go environment
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: source
        run: bash "$BUILDER_ROOT/scripts/ci_run.sh" go-environment bash "$BUILDER_ROOT/overlay/hybrid-v6/tools/hybrid/steps/environment.sh"

      - name: 03 — Apply minimal core patch
        if: always()
        continue-on-error: true
        shell: bash
        run: bash scripts/ci_run.sh apply-core-patch bash scripts/apply_core_patch.sh source

      - name: 04 — Add required Windows modules without replacing upstream go.mod
        if: always()
        continue-on-error: true
        shell: bash
        run: bash scripts/ci_run.sh prepare-modules bash scripts/prepare_modules.sh source

      - name: 05 — Verify patched source and dependency locks
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: source
        run: bash "$BUILDER_ROOT/scripts/ci_run.sh" source-verify bash tools/hybrid/steps/source_verify.sh

      - name: 06 — Resolve and vendor dependencies
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: source
        run: bash "$BUILDER_ROOT/scripts/ci_run.sh" vendor bash tools/hybrid/steps/vendor.sh

      - name: 07 — Apply exact hybrid vendor transformations
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: source
        run: bash "$BUILDER_ROOT/scripts/ci_run.sh" apply-vendor-patch python3 tools/hybrid/apply_hybrid.py --root .

      - name: 08 — Gofmt patched files
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: source
        run: bash "$BUILDER_ROOT/scripts/ci_run.sh" gofmt bash tools/hybrid/steps/gofmt.sh

      - name: 09 — Verify all four profiles after patching
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: source
        run: bash "$BUILDER_ROOT/scripts/ci_run.sh" verify-patch python3 tools/hybrid/apply_hybrid.py --root . --verify-only

      - name: 10 — Targeted tests
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: source
        run: bash "$BUILDER_ROOT/scripts/ci_run.sh" tests bash tools/hybrid/steps/tests.sh

      - name: 11 — Compile verge-mihomo.exe
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: source
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
          GOAMD64: v2
        run: bash "$BUILDER_ROOT/scripts/ci_run.sh" compile bash tools/hybrid/steps/compile.sh

      - name: 12 — Download and verify Wintun amd64
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: source
        run: bash "$BUILDER_ROOT/scripts/ci_run.sh" wintun bash tools/hybrid/steps/wintun.sh

      - name: 13 — Static PE smoke test
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: source
        run: bash "$BUILDER_ROOT/scripts/ci_run.sh" linux-smoke python3 "$BUILDER_ROOT/scripts/verify_pe.py" dist/verge-mihomo.exe dist/wintun.dll

      - name: 14 — Package fixed runtime filenames
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: source
        run: bash "$BUILDER_ROOT/scripts/ci_run.sh" package bash tools/hybrid/steps/package.sh

      - name: Evaluate build gate
        id: gate
        if: always()
        continue-on-error: true
        shell: bash
        run: bash scripts/final_gate.sh

      - name: Finalize downloadable logs even after failure
        if: always()
        continue-on-error: true
        shell: bash
        run: python3 scripts/finalize_logs.py

      - name: Upload complete build logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ inputs.upstream_tag }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9

      - name: Set candidate artifact name
        id: names
        if: steps.gate.outcome == 'success'
        shell: bash
        run: echo "candidate_name=hybrid-candidate-${UPSTREAM_TAG}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload temporary release candidate
        if: steps.gate.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: hybrid-candidate-${{ inputs.upstream_tag }}-${{ github.run_id }}
          path: |
            source/dist/verge-mihomo.exe
            source/dist/wintun.dll
            source/dist/LICENSE-wintun.txt
            source/dist/SHA256SUMS.txt
            source/dist/build-info.json
            source/dist/verge-mihomo-${{ inputs.upstream_tag }}-hybrid-windows-amd64.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Preserve original build result
        if: always() && steps.gate.outcome != 'success'
        shell: bash
        run: |
          echo "Build gate failed. Download the build-logs artifact."
          exit 1

  windows-smoke:
    name: Windows DLL and executable smoke test
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Initialize Windows smoke logs
        shell: pwsh
        run: New-Item -ItemType Directory -Force windows-logs | Out-Null

      - name: Download release candidate
        id: candidate_download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: hybrid-candidate-${{ inputs.upstream_tag }}-${{ github.run_id }}
          path: candidate

      - name: Load wintun.dll and execute version command
        id: smoke
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = 'windows-logs/windows-smoke.log'
          try {
            $exe = (Get-ChildItem candidate -Recurse -Filter verge-mihomo.exe | Select-Object -First 1).FullName
            $dll = (Get-ChildItem candidate -Recurse -Filter wintun.dll | Select-Object -First 1).FullName
            if (-not $exe -or -not $dll) { throw 'E41_WINDOWS_SMOKE: missing EXE or DLL' }
            Copy-Item $dll (Join-Path (Split-Path $exe) 'wintun.dll') -Force
            "exe=$exe`ndll=$dll" | Tee-Object -FilePath $log
            $handle = [System.Runtime.InteropServices.NativeLibrary]::Load($dll)
            if ($handle -eq [IntPtr]::Zero) { throw 'E42_WINTUN_DLL: NativeLibrary.Load returned zero' }
            [System.Runtime.InteropServices.NativeLibrary]::Free($handle)
            'wintun_load=PASS' | Tee-Object -FilePath $log -Append
            & $exe -v 2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "E41_WINDOWS_SMOKE: verge-mihomo.exe -v exit=$LASTEXITCODE" }
            'exe_version=PASS' | Tee-Object -FilePath $log -Append
          } catch {
            ($_ | Out-String) | Tee-Object -FilePath $log -Append
            exit 1
          }

      - name: Upload Windows smoke logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke-logs-${{ inputs.upstream_tag }}-${{ github.run_id }}
          path: windows-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve Windows smoke result
        if: always() && steps.smoke.outcome != 'success'
        shell: pwsh
        run: exit 1

  release:
    name: Publish GitHub Release
    needs: [build, windows-smoke]
    if: inputs.publish_release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Initialize release logs
        shell: bash
        run: mkdir -p release-logs

      - name: Download verified candidate
        id: release_download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: hybrid-candidate-${{ inputs.upstream_tag }}-${{ github.run_id }}
          path: dist

      - name: Publish fixed filenames in tag-specific Release
        id: publish
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p release-logs
          release_tag="hybrid-${UPSTREAM_TAG}-${RELEASE_REVISION}"
          zip_file="$(find dist -type f -name "verge-mihomo-${UPSTREAM_TAG}-hybrid-windows-amd64.zip" -print -quit)"
          cat > release-notes.txt <<NOTES
          Mihomo upstream: ${UPSTREAM_TAG}
          Hybrid patch: ${PATCH_REVISION}
          Windows amd64: verge-mihomo.exe + wintun.dll
          Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          NOTES
          gh release create "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mihomo ${UPSTREAM_TAG} hybrid 4 profiles ${RELEASE_REVISION}" \
            --notes-file release-notes.txt \
            "$(find dist -type f -name verge-mihomo.exe -print -quit)#verge-mihomo.exe" \
            "$(find dist -type f -name wintun.dll -print -quit)#wintun.dll" \
            "$(find dist -type f -name LICENSE-wintun.txt -print -quit)#LICENSE-wintun.txt" \
            "$(find dist -type f -name SHA256SUMS.txt -print -quit)#SHA256SUMS.txt" \
            "$(find dist -type f -name build-info.json -print -quit)#build-info.json" \
            "${zip_file}#verge-mihomo-${UPSTREAM_TAG}-hybrid-windows-amd64.zip" \
            2>&1 | tee release-logs/release.log

      - name: Upload release logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release-logs-${{ inputs.upstream_tag }}-${{ github.run_id }}
          path: release-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve release result
        if: always() && steps.publish.outcome != 'success'
        shell: bash
        run: exit 1

  issue-state:
    name: Record failure once and block repeated auto retries
    needs: [build, windows-smoke, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout issue helper
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create one failure issue or close it after success
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          WINDOWS_RESULT: ${{ needs.windows-smoke.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          if [[ "$BUILD_RESULT" == success && "$WINDOWS_RESULT" == success ]] && \
             { [[ "$PUBLISH_RELEASE" != true ]] || [[ "$RELEASE_RESULT" == success ]]; }; then
            echo "BUILD_OUTCOME=success" >> "$GITHUB_ENV"
            BUILD_OUTCOME=success python3 scripts/manage_issue.py
          else
            echo "BUILD_OUTCOME=failure" >> "$GITHUB_ENV"
            BUILD_OUTCOME=failure python3 scripts/manage_issue.py
          fi
