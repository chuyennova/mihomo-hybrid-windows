name: Test Mihomo v1.19.29 Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-baseline-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-baseline:
    name: Verify baseline ZIP
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      BASELINE_ZIP: mihomo-1.19.29.zip
      EXPECTED_MODULE: github.com/metacubex/mihomo
      LOG_SUBDIR: mihomo-baseline-logs
      EXTRACT_SUBDIR: mihomo-baseline-source

    steps:
      # Log được đặt trong RUNNER_TEMP nên không bị actions/checkout xóa.
      - name: 01 - Initialize persistent logs
        id: initialize
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $logDir = Join-Path $env:RUNNER_TEMP $env:LOG_SUBDIR

          if (Test-Path -LiteralPath $logDir) {
            Remove-Item -LiteralPath $logDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

          $initialLog = @(
            "MIHOMO BASELINE VERIFICATION"
            ""
            "Started UTC: $([DateTime]::UtcNow.ToString('o'))"
            "Repository: $env:GITHUB_REPOSITORY"
            "Repository commit: $env:GITHUB_SHA"
            "Branch/ref: $env:GITHUB_REF"
            "Workflow: $env:GITHUB_WORKFLOW"
            "Workflow run ID: $env:GITHUB_RUN_ID"
            "Workflow run attempt: $env:GITHUB_RUN_ATTEMPT"
            "Workflow run URL: $runUrl"
            "Runner OS: $env:RUNNER_OS"
            "Runner architecture: $env:RUNNER_ARCH"
            "Runner name: $env:RUNNER_NAME"
            "Baseline ZIP: $env:BASELINE_ZIP"
            "Log directory: $logDir"
            ""
            "===== 01 INITIALIZE LOGS ====="
            "Status: PASS"
          )

          $initialLog |
            Set-Content -LiteralPath (Join-Path $logDir "full-build.log") -Encoding utf8

          @(
            "Stage: 01_INITIALIZE_LOGS"
            "Status: PASS"
            "Log directory: $logDir"
          ) |
            Set-Content -LiteralPath (Join-Path $logDir "initialize-report.txt") -Encoding utf8

      - name: 02 - Checkout repository
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: 03 - Record checkout and environment
        id: environment
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        run: |
          $ErrorActionPreference = "Stop"

          $logDir = Join-Path $env:RUNNER_TEMP $env:LOG_SUBDIR
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          $fullLog = Join-Path $logDir "full-build.log"

          if (-not (Test-Path -LiteralPath $fullLog)) {
            @(
              "MIHOMO BASELINE VERIFICATION"
              ""
              "WARNING: Initial log was unavailable and has been recreated."
            ) |
              Set-Content -LiteralPath $fullLog -Encoding utf8
          }

          try {
            $powerShellVersion = $PSVersionTable.PSVersion.ToString()
            $osVersion = [System.Environment]::OSVersion.VersionString
            $processArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture
            $goVersion = ((& go version 2>&1) | Out-String).Trim()

            $environmentLines = @(
              ""
              "===== 02 CHECKOUT REPOSITORY ====="
              "Checkout outcome: $env:CHECKOUT_OUTCOME"
              ""
              "===== 03 BUILD ENVIRONMENT ====="
              "Recorded UTC: $([DateTime]::UtcNow.ToString('o'))"
              "PowerShell version: $powerShellVersion"
              "Operating system: $osVersion"
              "Process architecture: $processArchitecture"
              "Runner OS: $env:RUNNER_OS"
              "Runner architecture: $env:RUNNER_ARCH"
              "Workspace: $env:GITHUB_WORKSPACE"
              "Runner temp: $env:RUNNER_TEMP"
              "Go version: $goVersion"
              "Baseline ZIP: $env:BASELINE_ZIP"
            )

            $environmentLines |
              Add-Content -LiteralPath $fullLog -Encoding utf8

            $environmentLines |
              Set-Content -LiteralPath (Join-Path $logDir "build-environment.txt") -Encoding utf8

            @(
              "Stage: 02_CHECKOUT_REPOSITORY"
              "Status: $env:CHECKOUT_OUTCOME"
              "Repository commit: $env:GITHUB_SHA"
            ) |
              Set-Content -LiteralPath (Join-Path $logDir "checkout-report.txt") -Encoding utf8
          }
          catch {
            @(
              ""
              "===== E03_ENVIRONMENT_RECORD ====="
              "Status: FAIL"
              "Error: $($_.Exception.Message)"
              "File: $($_.InvocationInfo.ScriptName)"
              "Line: $($_.InvocationInfo.ScriptLineNumber)"
              "Command: $($_.InvocationInfo.Line)"
              "Exit code: 1"
            ) |
              Add-Content -LiteralPath $fullLog -Encoding utf8

            throw
          }

      - name: 04 - Verify and extract baseline
        id: verify
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $logDir = Join-Path $env:RUNNER_TEMP $env:LOG_SUBDIR
          $extractDir = Join-Path $env:RUNNER_TEMP $env:EXTRACT_SUBDIR
          $zipPath = Join-Path $env:GITHUB_WORKSPACE $env:BASELINE_ZIP
          $fullLog = Join-Path $logDir "full-build.log"
          $reportPath = Join-Path $logDir "baseline-report.txt"

          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          if (-not (Test-Path -LiteralPath $fullLog)) {
            "full-build.log recreated during verification." |
              Set-Content -LiteralPath $fullLog -Encoding utf8
          }

          try {
            @(
              ""
              "===== 04 VERIFY BASELINE ZIP ====="
              "ZIP path: $zipPath"
              "Extract directory: $extractDir"
              "Command: Expand-Archive -LiteralPath ZIP -DestinationPath EXTRACT_DIR -Force"
            ) |
              Add-Content -LiteralPath $fullLog -Encoding utf8

            if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
              throw "E04_BASELINE_NOT_FOUND: Không tìm thấy file $env:BASELINE_ZIP trong thư mục gốc repository."
            }

            $zipFile = Get-Item -LiteralPath $zipPath

            if ($zipFile.Length -le 0) {
              throw "E05_BASELINE_EMPTY: File ZIP có dung lượng bằng 0."
            }

            $zipHash = Get-FileHash -LiteralPath $zipPath -Algorithm SHA256

            @(
              "ZIP size: $($zipFile.Length) bytes"
              "ZIP SHA256: $($zipHash.Hash)"
            ) |
              Add-Content -LiteralPath $fullLog -Encoding utf8

            if (Test-Path -LiteralPath $extractDir) {
              Remove-Item -LiteralPath $extractDir -Recurse -Force
            }

            New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

            Expand-Archive `
              -LiteralPath $zipPath `
              -DestinationPath $extractDir `
              -Force

            $allFiles = @(
              Get-ChildItem `
                -LiteralPath $extractDir `
                -Recurse `
                -File `
                -Force
            )

            if ($allFiles.Count -eq 0) {
              throw "E06_EXTRACT_EMPTY: ZIP giải nén thành công nhưng không chứa file nào."
            }

            $goMod = @(
              Get-ChildItem `
                -LiteralPath $extractDir `
                -Recurse `
                -File `
                -Filter "go.mod" `
                -Force
            ) |
              Sort-Object { $_.FullName.Length } |
              Select-Object -First 1

            if (-not $goMod) {
              throw "E07_GO_MOD_NOT_FOUND: Không tìm thấy go.mod sau khi giải nén."
            }

            $sourceRoot = Split-Path -Parent $goMod.FullName
            $goSum = Join-Path $sourceRoot "go.sum"

            if (-not (Test-Path -LiteralPath $goSum -PathType Leaf)) {
              throw "E08_GO_SUM_NOT_FOUND: Không tìm thấy go.sum cạnh go.mod."
            }

            $moduleLine = Get-Content -LiteralPath $goMod.FullName |
              Where-Object { $_ -match "^\s*module\s+" } |
              Select-Object -First 1

            if (-not $moduleLine) {
              throw "E09_MODULE_NOT_FOUND: Không đọc được dòng module trong go.mod."
            }

            $moduleName = ($moduleLine -replace "^\s*module\s+", "").Trim()

            if ($moduleName -ne $env:EXPECTED_MODULE) {
              throw "E10_MODULE_MISMATCH: Module nhận được '$moduleName', mong đợi '$env:EXPECTED_MODULE'."
            }

            $goModHash = Get-FileHash -LiteralPath $goMod.FullName -Algorithm SHA256
            $goSumHash = Get-FileHash -LiteralPath $goSum -Algorithm SHA256

            $successLines = @(
              ""
              "===== BASELINE VERIFICATION RESULT ====="
              "Status: PASS"
              "Source root: $sourceRoot"
              "Extracted file count: $($allFiles.Count)"
              "Module: $moduleName"
              "go.mod: $($goMod.FullName)"
              "go.mod SHA256: $($goModHash.Hash)"
              "go.sum: $goSum"
              "go.sum SHA256: $($goSumHash.Hash)"
              "ZIP SHA256: $($zipHash.Hash)"
            )

            $successLines |
              Add-Content -LiteralPath $fullLog -Encoding utf8

            @(
              "Stage: 04_VERIFY_BASELINE"
              "Status: PASS"
              "Failure code: NONE"
              "Baseline ZIP: $env:BASELINE_ZIP"
              "ZIP size: $($zipFile.Length) bytes"
              "ZIP SHA256: $($zipHash.Hash)"
              "Source root: $sourceRoot"
              "Extracted file count: $($allFiles.Count)"
              "Module: $moduleName"
              "go.mod SHA256: $($goModHash.Hash)"
              "go.sum SHA256: $($goSumHash.Hash)"
              "Exit code: 0"
            ) |
              Set-Content -LiteralPath $reportPath -Encoding utf8
          }
          catch {
            $errorMessage = $_.Exception.Message
            $errorFile = $_.InvocationInfo.ScriptName
            $errorLine = $_.InvocationInfo.ScriptLineNumber
            $errorCommand = $_.InvocationInfo.Line

            $failureCode = "E99_UNKNOWN"

            if ($errorMessage -match "(E\d+_[A-Z0-9_]+)") {
              $failureCode = $Matches[1]
            }

            @(
              ""
              "===== BASELINE VERIFICATION FAILURE ====="
              "Status: FAIL"
              "Failure code: $failureCode"
              "Error: $errorMessage"
              "File: $errorFile"
              "Line: $errorLine"
              "Command: $errorCommand"
              "Exit code: 1"
            ) |
              Add-Content -LiteralPath $fullLog -Encoding utf8

            @(
              "Stage: 04_VERIFY_BASELINE"
              "Status: FAIL"
              "Failure code: $failureCode"
              "Baseline ZIP: $env:BASELINE_ZIP"
              "Error: $errorMessage"
              "File: $errorFile"
              "Line: $errorLine"
              "Command: $errorCommand"
              "Exit code: 1"
            ) |
              Set-Content -LiteralPath $reportPath -Encoding utf8

            exit 1
          }

      - name: 05 - Create final summary
        id: summary
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          ENVIRONMENT_OUTCOME: ${{ steps.environment.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          $ErrorActionPreference = "Stop"

          $logDir = Join-Path $env:RUNNER_TEMP $env:LOG_SUBDIR
          $fullLog = Join-Path $logDir "full-build.log"
          $reportPath = Join-Path $logDir "baseline-report.txt"
          $summaryPath = Join-Path $logDir "summary.txt"

          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          if (-not (Test-Path -LiteralPath $fullLog)) {
            @(
              "MIHOMO BASELINE VERIFICATION"
              ""
              "WARNING: full-build.log had to be recreated in the final step."
            ) |
              Set-Content -LiteralPath $fullLog -Encoding utf8
          }

          if (-not (Test-Path -LiteralPath $reportPath)) {
            if ($env:CHECKOUT_OUTCOME -ne "success") {
              $failureCode = "E02_CHECKOUT_FAILED"
              $failureMessage = "Repository checkout failed. Xem log trực tiếp của bước 02 trên GitHub Actions."
            }
            elseif ($env:VERIFY_OUTCOME -eq "skipped") {
              $failureCode = "E03_VERIFY_SKIPPED"
              $failureMessage = "Bước xác minh baseline đã bị bỏ qua."
            }
            else {
              $failureCode = "E98_REPORT_NOT_CREATED"
              $failureMessage = "Không tạo được baseline-report.txt."
            }

            @(
              "Stage: FINALIZE_REPORT"
              "Status: FAIL"
              "Failure code: $failureCode"
              "Error: $failureMessage"
              "Exit code: 1"
            ) |
              Set-Content -LiteralPath $reportPath -Encoding utf8
          }

          $reportText = Get-Content -LiteralPath $reportPath -Raw

          $finalResult = "PASS"
          $finalFailureCode = "NONE"

          if (
            $env:INITIALIZE_OUTCOME -ne "success" -or
            $env:CHECKOUT_OUTCOME -ne "success" -or
            $env:ENVIRONMENT_OUTCOME -ne "success" -or
            $env:VERIFY_OUTCOME -ne "success" -or
            $reportText -match "Status:\s*FAIL"
          ) {
            $finalResult = "FAIL"

            $failureMatch = [regex]::Match(
              $reportText,
              "E\d+_[A-Z0-9_]+"
            )

            if ($failureMatch.Success) {
              $finalFailureCode = $failureMatch.Value
            }
            elseif ($env:CHECKOUT_OUTCOME -ne "success") {
              $finalFailureCode = "E02_CHECKOUT_FAILED"
            }
            else {
              $finalFailureCode = "E99_UNKNOWN"
            }
          }

          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

          $summaryLines = @(
            "MIHOMO BASELINE SUMMARY"
            ""
            "Baseline ZIP: $env:BASELINE_ZIP"
            "Expected module: $env:EXPECTED_MODULE"
            "Final result: $finalResult"
            "Failure code: $finalFailureCode"
            ""
            "Initialize logs: $env:INITIALIZE_OUTCOME"
            "Checkout repository: $env:CHECKOUT_OUTCOME"
            "Record environment: $env:ENVIRONMENT_OUTCOME"
            "Verify baseline: $env:VERIFY_OUTCOME"
            ""
            "Repository commit: $env:GITHUB_SHA"
            "Workflow run ID: $env:GITHUB_RUN_ID"
            "Workflow run attempt: $env:GITHUB_RUN_ATTEMPT"
            "Workflow run URL: $runUrl"
            "Completed UTC: $([DateTime]::UtcNow.ToString('o'))"
            ""
            "----- BASELINE REPORT -----"
            $reportText.Trim()
          )

          $summaryLines |
            Set-Content -LiteralPath $summaryPath -Encoding utf8

          @(
            ""
            "===== 05 FINAL SUMMARY ====="
            "Final result: $finalResult"
            "Failure code: $finalFailureCode"
            "Completed UTC: $([DateTime]::UtcNow.ToString('o'))"
          ) |
            Add-Content -LiteralPath $fullLog -Encoding utf8

          "## Mihomo v1.19.29 baseline" |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          "" |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          $summaryLines |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: 06 - Upload downloadable logs
        id: upload_logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: baseline-v1.19.29-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mihomo-baseline-logs/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          overwrite: true

      - name: 07 - Enforce final result
        if: always()
        shell: pwsh
        env:
          INITIALIZE_OUTCOME: ${{ steps.initialize.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          ENVIRONMENT_OUTCOME: ${{ steps.environment.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_logs.outcome }}
        run: |
          $failedStages = @()

          if ($env:INITIALIZE_OUTCOME -ne "success") {
            $failedStages += "01_INITIALIZE_LOGS=$env:INITIALIZE_OUTCOME"
          }

          if ($env:CHECKOUT_OUTCOME -ne "success") {
            $failedStages += "02_CHECKOUT=$env:CHECKOUT_OUTCOME"
          }

          if ($env:ENVIRONMENT_OUTCOME -ne "success") {
            $failedStages += "03_ENVIRONMENT=$env:ENVIRONMENT_OUTCOME"
          }

          if ($env:VERIFY_OUTCOME -ne "success") {
            $failedStages += "04_VERIFY_BASELINE=$env:VERIFY_OUTCOME"
          }

          if ($env:SUMMARY_OUTCOME -ne "success") {
            $failedStages += "05_CREATE_SUMMARY=$env:SUMMARY_OUTCOME"
          }

          if ($env:UPLOAD_OUTCOME -ne "success") {
            $failedStages += "06_UPLOAD_LOGS=$env:UPLOAD_OUTCOME"
          }

          if ($failedStages.Count -gt 0) {
            Write-Host "FAILED STAGES:"
            $failedStages | ForEach-Object { Write-Host " - $_" }
            exit 1
          }

          Write-Host "Baseline verification passed and logs were uploaded."
